apiVersion: apps/v1
kind: Deployment
metadata:
  name: flywheel
  namespace: front-desk
spec:
  replicas: 4
  template:
    spec:
      containers:
        - name: api
          image: registry.invalid/flywheel:9.3.1
          ports:
            - containerPort: 8123
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
