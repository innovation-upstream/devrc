<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- browser-bridge icon — a gruvbox-tinted "bridge / link" glyph.
       Motif: a loopback (blue node, 127.0.0.1) linked to the browser (yellow
       node, the live tab) by an interlocking chain link across the middle.
       Palette: gruvbox dark bg #282828, blue accent #458588, yellow #fabd2f. -->
  <defs>
    <clipPath id="rounded">
      <rect x="2" y="2" width="124" height="124" rx="28" ry="28"/>
    </clipPath>
  </defs>

  <!-- dark rounded field + subtle border (gruvbox bg0 / bg1) -->
  <g clip-path="url(#rounded)">
    <rect x="0" y="0" width="128" height="128" fill="#282828"/>
    <rect x="2" y="2" width="124" height="124" rx="28" ry="28"
          fill="none" stroke="#3c3836" stroke-width="4"/>
  </g>

  <!-- the two link rings, drawn as rounded-rect rings that overlap in the
       middle to read as a chain "bridge" between the two sides. Round caps keep
       the mark legible when rasterised down to 16px. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="13">
    <!-- left ring — loopback side (gruvbox blue) -->
    <rect x="20" y="46" width="52" height="36" rx="18" ry="18" stroke="#458588"/>
    <!-- right ring — browser side (gruvbox yellow), drawn over the seam so the
         two interlock -->
    <rect x="56" y="46" width="52" height="36" rx="18" ry="18" stroke="#fabd2f"/>
  </g>

  <!-- loopback dots: the two endpoint nodes the bridge connects -->
  <circle cx="27" cy="64" r="6.5" fill="#83a598"/>
  <circle cx="101" cy="64" r="6.5" fill="#fabd2f"/>
</svg>
