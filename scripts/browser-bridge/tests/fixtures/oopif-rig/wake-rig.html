<!doctype html>
<meta charset="utf-8">
<title>wake-rig</title>
<!--
  THROTTLE-SENSITIVE fixture for the `wake` op / `--wake` reads.

  The static OOPIF rig pages render fine while hidden, so they cannot demonstrate an
  un-throttle. This page deliberately paints its real content ONLY after a
  requestAnimationFrame chain completes -- and a background (visibilityState:"hidden")
  tab produces no compositor frames, so rAF never fires there.

    hidden / throttled  -> body text contains  WAKE-RIG-SHELL   (and NOT the sentinel)
    un-throttled        -> body text contains  WAKE-RIG-RENDERED

  window.__rig = {raf, timer, rendered, ms} is the machine-readable counter set.
-->
<body>
<div id="app">WAKE-RIG-SHELL (waiting for frames)</div>
<pre id="dbg"></pre>
<script>
window.__rig = { raf: 0, timer: 0, rendered: false, ms: 0, need: 30 };
var t0 = performance.now();

// timer channel: a 1Hz-throttled hidden tab climbs this very slowly
(function tick() {
  window.__rig.timer++;
  setTimeout(tick, 0);
})();

// paint channel: needs `need` real animation frames before it swaps in the sentinel
(function frame() {
  window.__rig.raf++;
  if (window.__rig.raf >= window.__rig.need) {
    window.__rig.rendered = true;
    window.__rig.ms = Math.round(performance.now() - t0);
    document.getElementById('app').textContent = 'WAKE-RIG-RENDERED';
    document.getElementById('dbg').textContent = JSON.stringify(window.__rig);
    return;
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
