<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Filed</title>
  <style>
    :root { color-scheme: light dark; }
    body { font: 13px/1.45 system-ui, sans-serif; margin: 0; padding: 12px 14px; }
    .row { display: flex; align-items: baseline; gap: 8px; }
    .to { opacity: .65; }
    #dir { font-weight: 600; font-size: 15px; word-break: break-word; }
    #badge { margin-left: auto; font-size: 11px; opacity: .6; white-space: nowrap; }
    #reason { margin-top: 6px; opacity: .75; font-size: 12px; word-break: break-word; }
    #dup { margin-top: 6px; font-size: 12px; color: #b45309; word-break: break-word; }
    #error { margin-top: 6px; font-size: 12px; color: #b91c1c; word-break: break-word; }
    .buttons { margin-top: 10px; display: flex; gap: 8px; align-items: center; }
    button { font: inherit; padding: 4px 10px; cursor: pointer; }
    /* The destructive one is NOT the visually dominant one, and it is not the
       one Escape or the auto-close reaches. Keeping the file is always the
       cheaper mistake. */
    #discard { color: #b91c1c; }
  </style>
</head>
<body>
  <div class="row"><span class="to">Filed to</span><span id="dir"></span><span id="badge"></span></div>
  <div id="reason"></div>
  <div id="dup" hidden></div>
  <!-- A refusal gets its OWN line, so it cannot erase which file the duplicate
       was OF -- the context needed to judge whether to retry. -->
  <div id="error" hidden></div>
  <div class="buttons">
    <button id="change">change…</button>
    <button id="keep" hidden>keep</button>
    <button id="discard" hidden>delete the new copy</button>
  </div>
  <script type="module" src="toast.js"></script>
</body>
</html>
