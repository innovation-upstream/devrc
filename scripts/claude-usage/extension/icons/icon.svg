<!-- icon.svg is the SOURCE OF TRUTH for the toolbar/notification icons.
     The PNGs beside it are generated. Edit this, re-render, then `git add`
     all four files: the flake ships only TRACKED files, so an untracked PNG
     is silently omitted from the deployed tree, no error anywhere.

     THE REGENERATION COMMAND LIVES IN scripts/claude-usage/README.md, not
     here, and that is forced rather than chosen: the command contains a
     literal double hyphen (the nix-shell run flag), which is ILLEGAL inside
     an XML comment and makes librsvg refuse this whole file. Measured twice,
     both times while writing this very comment. So a README carries it, the
     way scripts/browser-bridge/README.md carries the same command for the
     same job.

     A round-0 audit cut the 59-line generator script that used to stand
     beside this file: nothing invoked it, no gate checked its output, and the
     silent-failure mode its verify step defended against had been introduced
     by that generator's own first draft. A hand-run rsvg-convert fails
     loudly to the terminal. -->
<!--

     Design constraints, in order:
       * must read at 16px in a browser toolbar -> one bold shape, no detail,
         no text, no thin strokes;
       * must sit on BOTH a light and a dark toolbar -> an opaque tile rather
         than a transparent glyph, so contrast never depends on the host;
       * must say "usage" at a glance -> a ring gauge, the same metaphor the
         badge percentage and the injected widget's bars use.
     The arc is a fixed ~65% sweep: a static icon cannot track live usage
     (the BADGE does that), so it depicts the concept, not a reading. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <rect width="128" height="128" rx="28" fill="#d97757"/>
  <!-- track: the unfilled remainder of the gauge -->
  <circle cx="64" cy="64" r="38" fill="none" stroke="#ffffff" stroke-opacity="0.34"
          stroke-width="15"/>
  <!-- filled sweep: circumference 2*pi*38 = 238.76; 155.2 = 65% of it.
       rotate(-90) starts the arc at 12 o'clock instead of 3 o'clock. -->
  <circle cx="64" cy="64" r="38" fill="none" stroke="#ffffff" stroke-width="15"
          stroke-linecap="round" stroke-dasharray="155.2 238.76"
          transform="rotate(-90 64 64)"/>
</svg>
